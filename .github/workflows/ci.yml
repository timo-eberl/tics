name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Linux: Build and run tests
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DTICS_ENABLE_DEBUG_VIEW=OFF \
            -DTICS_ENABLE_PROFILER=OFF \
            -DTICS_BUILD_TOOL_GLB2C=OFF \
            -DTICS_BUILD_DEMOS=OFF
          cmake --build build --parallel

      - name: Test
        run: ./tests/run_tests.sh
